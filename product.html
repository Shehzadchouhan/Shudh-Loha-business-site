<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details | Shudh Loha</title>
<meta name="description" content="Product details for Shudh Loha pure iron cookware." />
<link rel="icon" type="image/png" href="logo.png" />
<style>
  :root{--ink:#171717;--cream:#FBFAF6;--cream-deep:#F1EBDD;--gold:#B88A24;--rust:#A97818;--line:rgba(20,18,16,.14);--display:Didot,'Bodoni MT','Times New Roman',serif;--body:'Trebuchet MS','Segoe UI',sans-serif}
  *,*::before,*::after{box-sizing:border-box}
  a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
  header{background:rgba(20,18,16,.96);border-bottom:1px solid rgba(251,250,246,.2);color:var(--cream)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font:700 21px var(--display);letter-spacing:2.5px}.brand span{display:inline-block;width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg);margin-right:10px}.nav-actions{display:flex;align-items:center;gap:18px}.back{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--cream)}.back:hover{color:var(--gold)}.language-select{background:transparent;color:var(--cream);border:1px solid rgba(251,250,246,.2);padding:8px 10px;font:inherit;font-size:12px}.language-select option{color:var(--ink)}
  main{padding:76px 0}.product{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,.9fr);gap:72px;align-items:center}.visual{background:var(--cream-deep);border:1px solid var(--line);padding:18px;min-height:360px;display:grid;place-items:center}.visual img{width:100%;max-height:470px;object-fit:contain}.visual .missing{font:700 24px var(--display);text-align:center;padding:40px}.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.details h1{font:700 clamp(38px,5vw,62px)/1.05 var(--display);margin:10px 0 18px}.facts{border-top:1px solid var(--line);margin:28px 0 0}.fact{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.fact strong{font-weight:700}.fact span{text-align:right;color:#5b554d}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;padding:13px 20px;border:1px solid var(--gold);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.primary{background:var(--gold)}.secondary:hover{background:var(--cream-deep)}
  footer{background:var(--ink);color:rgba(244,238,225,.7);padding:30px 0;text-align:center;font-size:13px}footer span{color:var(--gold)}
  .lead-form{border-top:1px solid var(--line);margin-top:28px;padding-top:20px;display:grid;gap:10px}.lead-form input,.lead-form textarea{width:100%;border:1px solid var(--line);padding:10px;background:var(--cream);font:inherit}.lead-form textarea{min-height:74px;resize:vertical}.lead-form button{border:1px solid var(--gold);background:var(--gold);padding:11px 14px;font-weight:700;cursor:pointer}.lead-form-status{font-size:13px;color:#5b554d;min-height:20px}
  .visual{gap:14px}.visual-main{width:100%;display:grid;place-items:center;cursor:zoom-in}.visual-main img{cursor:zoom-in}.visual-thumbs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.visual-thumb{width:58px;height:58px;padding:3px;border:1px solid var(--line);background:var(--cream);cursor:pointer}.visual-thumb.is-active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,138,36,.18)}.visual-thumb img{width:100%;height:100%;object-fit:cover}
  @media(max-width:760px){main{padding:42px 0}.wrap{padding:0 18px}.nav{min-height:0;padding:12px 18px;flex-wrap:wrap;row-gap:10px}.brand{font-size:18px;flex:1}.nav-actions{flex:1 1 100%;justify-content:space-between;gap:10px}.back{font-size:11px}.language-select{padding:7px 8px}.product{grid-template-columns:1fr;gap:28px}.visual{min-height:240px;padding:12px}.details h1{font-size:clamp(36px,12vw,54px)}.fact{font-size:13px}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:22px}.btn{justify-content:center;width:100%}.lead-form{margin-top:24px}}
  body{margin:0;background:#f5f5f5}.visual{border:0;background:#fff}.facts{border:0;margin-top:20px}.fact{border:0;padding:6px 0}.lead-form{border:0;padding-top:0}.lead-form input,.lead-form textarea{border:0;background:#fff}.lead-form-status{color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index.html"><span></span>SHUDH LOHA</a></div></header>
<main><div class="wrap product">
  <div class="visual" id="visual"></div>
  <article class="details">
    <p class="eyebrow" id="category" data-lang="productCategory">Shudh Loha</p>
    <h1 id="name">Product details</h1>
    <div class="facts">
      <div class="fact"><strong data-lang="material">Material</strong><span data-lang="pureIron">Pure iron</span></div>
      <div class="fact"><strong data-lang="finish">Finish</strong><span data-lang="handFinished">Hand-finished</span></div>
      <div class="fact"><strong data-lang="sizeWeight">Size & weight</strong><span data-lang="confirmWithUs">Confirm with us</span></div>
      <div class="fact"><strong data-lang="price">Price</strong><span data-lang="askPrice">Ask for current price</span></div>
    </div>
    <div class="actions"><a class="btn primary" id="whatsapp" href="" target="_blank" rel="noopener" data-lang="askWhatsapp">Ask on WhatsApp</a><a class="btn secondary" href="tel:+917973247767" aria-label="Call Shudh Loha at +91 79732 47767" data-lang="callUs">Call us</a></div>
    <form class="lead-form" id="leadForm"><strong>Send an enquiry</strong><input id="leadName" placeholder="Your name" required><input id="leadPhone" type="tel" placeholder="Phone number" required><textarea id="leadMessage" placeholder="What would you like to know?"></textarea><button type="submit">Send enquiry</button><div class="lead-form-status" id="leadStatus" role="status"></div></form>
</article></div></main>
<footer><div class="wrap">Shudh Loha — <span data-lang="footerTagline">Pure Loha, Pure Quality</span> · <span data-lang="address">Malerkotla, Punjab</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const number = '917973247767';
  const products = {
    'Big Deg': ['Iron Cookware', 'Assets 2/Big Deg.jpeg'],
    'Tikki Tavi': ['Iron Cookware', 'Assets 2/Tikki Tavi.jpeg'],
    'White Batta': ['Iron Cookware', 'Assets 2/White batta.png'],
    'Tutma Tava': ['Iron Cookware', 'Assets 2/tutma tawa.png'],
    'Batta': ['Iron Cookware', 'Assets 2/batta.png'],
    'Kadhai': ['Iron Cookware', 'Assets 2/kadhai.png'],
    'Deg': ['Iron Cookware', 'Assets 2/deg.png'],
    'Iron Tawa': ['Iron Cookware', 'Assets 2/tawi.png'],
    'Fry Pan': ['Iron Cookware', 'Assets 2/fry pan.png'],
    'Iron Fork': ['Iron Cookware', 'Assets 2/fork.png'],
    'Iron Spoon': ['Iron Cookware', 'Assets 2/karchi without handle.png'],
    'Set of Glasses': ['Iron Cookware', 'Assets 2/glasses.png'],
    'Iron Tava': ['Iron Cookware', 'Assets 2/tawa.png']
  };
  const item = new URLSearchParams(location.search).get('item') || 'Kadhai';
  sessionStorage.setItem('shudhPendingItem', item);
  let product = products[item] || products['Iron Tawa'];
  if (shudhSupabase) {
    shudhSupabase.from('products').select('name,category,image_url,image_urls,description,price').eq('name', item).eq('is_active', true).maybeSingle().then(({ data }) => {
      if (!data) return;
      const category = data.category === 'Iron Kitchenware' ? 'Sarbloh' : data.category;
      product = [category, data.image_url, data.description, data.price, data.image_urls || []];
      document.getElementById('category').textContent = category;
      renderVisual(data.name, data.image_url, data.image_urls || []);
      document.querySelector('[data-lang="askPrice"]').textContent = data.price || 'Ask for current price';
    });
  }
  document.title = `${item} | Shudh Loha`;
  document.getElementById('name').textContent = item;
  document.getElementById('category').textContent = product[0];
  function renderVisual(name, mainImage, galleryImages = []) {
    const images = [...new Set([mainImage, ...(Array.isArray(galleryImages) ? galleryImages : [])].filter(Boolean))];
    const visual = document.getElementById('visual');
    if (!images.length) { visual.innerHTML = '<div class="missing">Ask us for a current photo</div>'; return; }
    visual.innerHTML = `<a class="visual-main" id="mainProductLink" href="${images[0]}" target="_blank" rel="noopener" aria-label="Open full-size ${name} image"><img id="mainProductImage" src="${images[0]}" alt="${name}" /></a>${images.length > 1 ? `<div class="visual-thumbs" aria-label="More views of ${name}">${images.map((src, index) => `<button class="visual-thumb${index === 0 ? ' is-active' : ''}" type="button" data-image="${src}" aria-label="View ${name} image ${index + 1}"><img src="${src}" alt="" /></button>`).join('')}</div>` : ''}`;
    visual.querySelectorAll('.visual-thumb').forEach((button) => button.addEventListener('click', () => { visual.querySelector('#mainProductImage').src = button.dataset.image; visual.querySelector('#mainProductLink').href = button.dataset.image; visual.querySelectorAll('.visual-thumb').forEach((thumb) => thumb.classList.toggle('is-active', thumb === button)); }));
  }
  renderVisual(item, product[1], product[4]);
  document.getElementById('whatsapp').href = `https://wa.me/${number}?text=${encodeURIComponent(`Hi, I'm interested in ${item}. Can you share the size, weight, price, and delivery details?`)}`;
  shudhTrackView();
  shudhTrackItemView(item);
  document.getElementById('whatsapp').addEventListener('click', () => shudhTrackLead('whatsapp', item));
  document.querySelector('a[href^="tel:"]').addEventListener('click', () => shudhTrackLead('phone', item));
  const translations = {
    en: { backProducts:'Back to products', productCategory:'Sarbloh', material:'Material', pureIron:'Pure iron', finish:'Finish', handFinished:'Hand-finished', sizeWeight:'Size & weight', confirmWithUs:'Confirm with us', price:'Price', askPrice:'Ask for current price', askWhatsapp:'Ask on WhatsApp', callUs:'Call us', footerTagline:'Pure Loha, Pure Quality', address:'Malerkotla, Punjab' },
    hi: { backProducts:'उत्पादों पर वापस जाएँ', productCategory:'लोहे के बर्तन', material:'सामग्री', pureIron:'शुद्ध लोहा', finish:'फिनिश', handFinished:'हाथ से तैयार', sizeWeight:'आकार और वजन', confirmWithUs:'हमसे पुष्टि करें', price:'कीमत', askPrice:'वर्तमान कीमत पूछें', askWhatsapp:'WhatsApp पर पूछें', callUs:'कॉल करें', footerTagline:'शुद्ध लोहा, शुद्ध गुणवत्ता', address:'मलेरकोटला, पंजाब' },
    pa: { backProducts:'ਉਤਪਾਦਾਂ ਤੇ ਵਾਪਸ', productCategory:'ਲੋਹੇ ਦੇ ਬਰਤਨ', material:'ਸਮੱਗਰੀ', pureIron:'ਸ਼ੁੱਧ ਲੋਹਾ', finish:'ਫਿਨਿਸ਼', handFinished:'ਹੱਥ ਨਾਲ ਤਿਆਰ', sizeWeight:'ਆਕਾਰ ਅਤੇ ਭਾਰ', confirmWithUs:'ਸਾਡੇ ਤੋਂ ਪੁਸ਼ਟੀ ਕਰੋ', price:'ਕੀਮਤ', askPrice:'ਮੌਜੂਦਾ ਕੀਮਤ ਪੁੱਛੋ', askWhatsapp:'WhatsApp ਤੇ ਪੁੱਛੋ', callUs:'ਕਾਲ ਕਰੋ', footerTagline:'ਸ਼ੁੱਧ ਲੋਹਾ, ਸ਼ੁੱਧ ਗੁਣਵੱਤਾ', address:'ਮਲੇਰਕੋਟਲਾ, ਪੰਜਾਬ' }
  };
  document.getElementById('leadForm').addEventListener('submit', async event => {
    event.preventDefault();
    const status = document.getElementById('leadStatus');
    if (!shudhSupabase) { status.textContent = 'Enquiries are not configured yet.'; return; }
    const { error } = await shudhSupabase.from('leads').insert({ kind: 'form', product_name: item, name: document.getElementById('leadName').value.trim(), phone: document.getElementById('leadPhone').value.trim(), message: document.getElementById('leadMessage').value.trim(), page_url: location.href });
    status.textContent = error ? 'Could not send. Please call or use WhatsApp.' : 'Thanks. We will contact you soon.';
    if (!error) event.target.reset();
  });
</script>
</body>
</html>
