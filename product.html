<script>
  const requestedItem = new URLSearchParams(location.search).get('item') || 'Big Deg';
  const fallbackProduct = window.getShudhProductByName(requestedItem);
  const item = fallbackProduct?.name || requestedItem;
  const hasFallbackProduct = Boolean(fallbackProduct);
  if (!shudhSupabase && !hasFallbackProduct) location.replace('products.html');
  let product = { category: 'Sarbloh', image: fallbackProduct?.image || '', galleryImages: fallbackProduct?.galleryImages || [], price: 'Price range on request', size: fallbackProduct?.size || '', approxWeight: fallbackProduct?.approxWeight || '', minimumOrder: fallbackProduct?.minimumOrder || '' };
  const resolveProductImage = (imageUrl) => fallbackProduct?.image || imageUrl || '';
  let productSize = product.size;
  let paymentLink = '';
  function renderRetailPurchaseActions() {
    document.getElementById('retailPurchaseActions').innerHTML = WhatsAppOrderModule.renderRetailPurchaseHtml(item, {
      size: productSize,
      paymentLink
    });
  }
  renderRetailPurchaseActions();
  if (shudhSupabase) {
    shudhSupabase.from('products').select('name,category,image_url,image_urls,video_urls,description,size,approx_weight,minimum_order,payment_link').eq('name', item).eq('is_active', true).maybeSingle().then(async ({ data, error }) => {
      if (error) {
        console.error('Could not load product details:', error);
        const legacy = await shudhSupabase.from('products').select('name,category,image_url,image_urls,video_urls,description').eq('name', item).eq('is_active', true).maybeSingle();
        if (legacy.error) {
          console.error('Could not load product details using legacy columns:', legacy.error);
          return;
        }
        data = legacy.data;
      }
      if (!data) {
        if (!hasFallbackProduct) location.replace('products.html');
        return;
      }
      if (data.category && !['Sarbloh', 'Iron Kitchenware'].includes(data.category)) {
        location.replace('products.html');
        return;
      }
      const category = data.category === 'Iron Kitchenware' ? 'Sarbloh' : data.category || 'Sarbloh';
      const image = resolveProductImage(data.image_url);
      const galleryImages = fallbackProduct
        ? fallbackProduct.galleryImages || []
        : (data.image_urls || []).map(resolveProductImage);
      product = {
        category,
        image,
        description: data.description,
        price: 'Price range on request',
        size: data.size || fallbackProduct?.size || '',
        approxWeight: data.approx_weight || fallbackProduct?.approxWeight || '',
        minimumOrder: data.minimum_order || fallbackProduct?.minimumOrder || '',
        galleryImages,
        videos: data.video_urls || []
      };
      productSize = product.size;
      paymentLink = data.payment_link || '';
      document.getElementById('category').textContent = category;
      document.getElementById('productSize').textContent = productSize;
      document.getElementById('productWeight').textContent = product.approxWeight;
      document.getElementById('productPrice').textContent = product.price;
      document.getElementById('productMinimumOrder').textContent = product.minimumOrder;
      renderRetailPurchaseActions();
      renderVisual(data.name, image, galleryImages, data.video_urls || []);
    });
  }
  document.title = `${item} | Shudh Loha`;
  document.getElementById('name').textContent = item;
  document.getElementById('category').textContent = product.category;
  document.getElementById('productSize').textContent = product.size;
  document.getElementById('productWeight').textContent = product.approxWeight;
  document.getElementById('productPrice').textContent = product.price;
  document.getElementById('productMinimumOrder').textContent = product.minimumOrder;
  function renderVisual(name, mainImage, galleryImages = [], galleryVideos = []) {
    const images = [...new Set([mainImage, ...(Array.isArray(galleryImages) ? galleryImages : [])].filter(Boolean))];
    const videos = [...new Set(Array.isArray(galleryVideos) ? galleryVideos.filter(Boolean) : [])];
    const media = [...images.map((src) => ({ src, type: 'image' })), ...videos.map((src) => ({ src, type: 'video' }))];
    const visual = document.getElementById('visual');
    if (!media.length) { visual.innerHTML = '<div class="missing">Ask us for a current photo or video</div>'; return; }
    visual.innerHTML = '<div class="visual-main" id="mainProductMedia"></div><div class="visual-thumbs" aria-label="Product photos and videos"></div>';
    const main = visual.querySelector('#mainProductMedia');
    const thumbnails = visual.querySelector('.visual-thumbs');
    function showMedia(index) {
      const selected = media[index];
      main.replaceChildren();
      if (selected.type === 'video') {
        const video = document.createElement('video');
        video.src = selected.src;
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', `${name} product video`);
        main.append(video);
      } else {
        const link = document.createElement('a');
        link.href = selected.src;
        link.target = '_blank';
        link.rel = 'noopener';
        link.setAttribute('aria-label', `Open full-size ${name} image`);
        const image = document.createElement('img');
        image.src = selected.src;
        image.alt = name;
        image.width = 600;
        image.height = 600;
        link.append(image);
        main.append(link);
      }
      thumbnails.querySelectorAll('.visual-thumb').forEach((thumb, thumbIndex) => thumb.classList.toggle('is-active', thumbIndex === index));
    }
    media.forEach((entry, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `visual-thumb${index === 0 ? ' is-active' : ''}`;
      button.setAttribute('aria-label', `View ${name} ${entry.type === 'video' ? 'video' : 'image'} ${entry.type === 'video' ? index - images.length + 1 : index + 1}`);
      if (entry.type === 'video') {
        const preview = document.createElement('video');
        preview.src = entry.src;
        preview.muted = true;
        preview.playsInline = true;
        preview.preload = 'none';
        const badge = document.createElement('span');
        badge.className = 'video-badge';
        badge.textContent = 'Video';
        button.append(preview, badge);
      } else {
        const preview = document.createElement('img');
        preview.src = entry.src;
        preview.alt = '';
        preview.width = 72;
        preview.height = 72;
        preview.loading = 'lazy';
        button.append(preview);
      }
      button.addEventListener('click', () => showMedia(index));
      thumbnails.append(button);
    });
    if (media.length === 1) thumbnails.hidden = true;
    showMedia(0);
  }
  renderVisual(item, product.image, product.galleryImages || [], product.videos || []);
  document.getElementById('whatsapp').href = `https://wa.me/${number}?text=${encodeURIComponent(`Hi, I'm interested in ${item}. Can you share the size, weight, current price range, and delivery details?`)}`;
  
  shudhTrackView();
  document.getElementById('whatsapp').addEventListener('click', () => shudhTrackLead('whatsapp', item));
  document.querySelector('a[href^="tel:"]').addEventListener('click', () => shudhTrackLead('phone', item));
  const translations = {
    en: { backProducts:'Back to products', productCategory:'Sarbloh', size:'Size', approxWeight:'Approx. weight', sellingPrice:'Price range', minimumOrder:'Minimum order', askWhatsapp:'Ask on WhatsApp', callUs:'Call us', footerTagline:'Pure Loha, Pure Quality', address:'Malerkotla, Punjab' },
    hi: { backProducts:'उत्पादों पर वापस जाएँ', productCategory:'लोहे के बर्तन', size:'आकार', approxWeight:'लगभग वजन', sellingPrice:'मूल्य सीमा', minimumOrder:'न्यूनतम ऑर्डर', askWhatsapp:'WhatsApp पर पूछें', callUs:'कॉल करें', footerTagline:'शुद्ध लोहा, शुद्ध गुणवत्ता', address:'मलेरकोटला, पंजाब' },
    pa: { backProducts:'ਉਤਪਾਦਾਂ ਤੇ ਵਾਪਸ', productCategory:'ਲੋਹੇ ਦੇ ਬਰਤਨ', size:'ਆਕਾਰ', approxWeight:'ਲਗਭਗ ਭਾਰ', sellingPrice:'ਕੀਮਤ ਸੀਮਾ', minimumOrder:'ਘੱਟੋ-ਘੱਟ ਆਰਡਰ', askWhatsapp:'WhatsApp ਤੇ ਪੁੱਛੋ', callUs:'ਕਾਲ ਕਰੋ', footerTagline:'ਸ਼ੁੱਧ ਲੋਹਾ, ਸ਼ੁੱਧ ਗੁਣਵੱਤਾ', address:'ਮਲੇਰਕੋਟਲਾ, ਪੰਜਾਬ' }
  };
  // Basic Indian & International phone validation
  function isValidPhoneNumber(phone) {
    if (!phone) return false;
    const digits = String(phone).replace(/\D/g, '');
    if (digits.length === 10 && /^[6-9]\d{9}$/.test(digits)) return true;
    if (digits.length === 11 && digits.startsWith('0') && /^[6-9]\d{9}$/.test(digits.slice(1))) return true;
    if (digits.length === 12 && digits.startsWith('91') && /^[6-9]\d{9}$/.test(digits.slice(2))) return true;
    return digits.length >= 10 && digits.length <= 15;
  }

  document.getElementById('leadForm').addEventListener('submit', async event => {
    event.preventDefault();
    const status = document.getElementById('leadStatus');

    // 1. Honeypot check
    const honeypot = document.getElementById('leadHp')?.value.trim();
    if (honeypot) {
      status.textContent = 'Enquiry sent! We will contact you soon.';
      event.target.reset();
      return;
    }

    const name = document.getElementById('leadName').value.trim();
    const phone = document.getElementById('leadPhone').value.trim();
    const message = document.getElementById('leadMessage').value.trim();

    if (!name) {
      status.style.color = '#a23b2d';
      status.textContent = 'Please enter your name.';
      document.getElementById('leadName').focus();
      return;
    }

    // 2. Phone number validation
    if (!isValidPhoneNumber(phone)) {
      status.style.color = '#a23b2d';
      status.textContent = 'Please enter a valid 10-digit WhatsApp or mobile number.';
      document.getElementById('leadPhone').focus();
      return;
    }

    if (!shudhSupabase) {
      status.style.color = '#a23b2d';
      status.textContent = 'Enquiries are not configured yet. Please call or use WhatsApp.';
      return;
    }

    status.style.color = 'var(--gold)';
    status.textContent = 'Submitting enquiry & opening WhatsApp...';

    const whatsappWindow = window.open('about:blank', '_blank');
    if (whatsappWindow) whatsappWindow.opener = null;

    // 3. Save to Supabase leads table
    try {
      const { error } = await shudhSupabase.from('leads').insert({
        kind: 'form',
        product_name: item,
        name,
        phone,
        message: message || 'Product enquiry from product details page',
        page_url: location.href
      });
      if (error) throw error;
    } catch (err) {
      console.error('Supabase lead error:', err);
      if (whatsappWindow) whatsappWindow.close();
      status.style.color = '#a23b2d';
      status.textContent = 'Could not save your enquiry. Please try again or contact us directly.';
      return;
    }

    // 4. Open WhatsApp with pre-filled message built from form fields
    const waText = `Hi Shudh Loha factory team,
I'm interested in *${item}*.
- Name: ${name || 'Customer'}
- Phone: ${phone}
${message ? '- Question: ' + message + '\n' : ''}
Please confirm current factory price, availability, and delivery details.`;

    const waUrl = `https://wa.me/917973247767?text=${encodeURIComponent(waText)}`;
if (whatsappWindow) {
  whatsappWindow.location.href = waUrl;
  status.textContent = 'Enquiry saved! WhatsApp chat opened.';
} else {
  status.replaceChildren(document.createTextNode('Enquiry saved. '));
  const whatsappLink = document.createElement('a');
  whatsappLink.href = waUrl;
  whatsappLink.target = '_blank';
  whatsappLink.rel = 'noopener noreferrer';
  whatsappLink.textContent = 'Open WhatsApp';
  status.append(whatsappLink);
}
event.target.reset();
  });
</script>
