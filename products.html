<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Kitchenware | Shudh Loha</title>
<meta name="description" content="Shop Shudh Loha Sarbloh and Non-Stick kitchen cookware." />
<link rel="icon" type="image/png" href="logo.png" />
<style>
  :root{--ink:#171717;--ink-soft:#5b554d;--paper:#fbfaf6;--paper-deep:#f1ebdd;--gold:#b88a24;--coral:#c7653e;--line:rgba(20,18,16,.14);--display:Didot,"Bodoni MT","Times New Roman",serif;--body:"Trebuchet MS","Segoe UI",sans-serif}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);background-image:linear-gradient(rgba(184,138,36,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(184,138,36,.045) 1px,transparent 1px);background-size:28px 28px}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.wrap{width:min(1180px,100%);margin:auto;padding:0 24px}
  header{position:sticky;top:0;z-index:10;background:rgba(23,23,23,.97);color:var(--paper);box-shadow:0 8px 24px rgba(23,23,23,.13)}.nav{position:relative;min-height:72px;display:flex;align-items:center;gap:24px}.brand{font:700 21px var(--display);letter-spacing:2.5px;white-space:nowrap}.brand span{display:inline-block;width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg);margin-right:11px}.menu-toggle{display:none;border:0;background:transparent;color:var(--paper);padding:8px 4px;cursor:pointer}.menu-toggle span{display:block;width:22px;height:2px;margin:4px 0;background:currentColor;transition:transform .2s ease,opacity .2s ease}.menu-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}.menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}.menu-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}.search{display:flex;flex:1;max-width:520px;background:#fff;color:var(--ink);border-radius:2px;overflow:hidden}.search input{min-width:0;flex:1;border:0;padding:11px 14px;background:transparent;color:inherit;font:inherit;outline:0}.search button{border:0;border-left:1px solid var(--line);background:var(--gold);padding:0 18px;cursor:pointer;font-weight:700}.nav-actions{display:flex;align-items:center;gap:16px;margin-left:auto}.back{font-size:12px;letter-spacing:1px;text-transform:uppercase}.language-select{background:transparent;color:var(--paper);border:1px solid rgba(251,250,246,.25);padding:8px 10px;font:inherit;font-size:12px}.language-select option{color:var(--ink)}
  .ticker{overflow:hidden;background:var(--gold);color:var(--ink)}.ticker-track{width:max-content;display:flex;gap:32px;padding:9px 0;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;animation:ticker 25s linear infinite}@keyframes ticker{to{transform:translateX(-50%)}}
  .hero{padding:58px 0 42px}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end}.eyebrow{margin:0;color:var(--coral);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase}.hero h1{max-width:760px;margin:10px 0 14px;font:700 clamp(44px,7vw,78px)/.96 var(--display);letter-spacing:.2px}.hero-copy{max-width:600px;margin:0;color:var(--ink-soft);font-size:17px}.hero-note{justify-self:end;max-width:260px;padding:20px 0 5px;border-top:2px solid var(--gold);color:var(--ink-soft);font-size:13px}.hero-note strong{display:block;margin-bottom:6px;color:var(--ink);font:700 24px var(--display)}
  .shop-shell{display:grid;grid-template-columns:220px 1fr;gap:28px;padding-bottom:80px}.filters{align-self:start;position:sticky;top:96px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.filters h2{margin:0 0 10px;font:700 24px var(--display)}.filters-toggle{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;padding:4px 0 10px;color:var(--ink-soft);cursor:pointer}.filters-toggle span{display:block;width:18px;height:2px;margin:2px 0;background:currentColor;transition:transform .2s ease,opacity .2s ease}.filters-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(4px) rotate(45deg)}.filters-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}.filters-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-4px) rotate(-45deg)}.category-list{display:grid;gap:6px}.category-list.is-hidden{display:none}.category-button{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid transparent;background:transparent;padding:11px 12px;color:var(--ink-soft);text-align:left;font:inherit;cursor:pointer}.category-button:hover,.category-button.active{border-color:var(--gold);background:var(--paper-deep);color:var(--ink);font-weight:700}.category-button span{font-size:12px;color:var(--coral)}.filter-caption{margin:28px 0 0;color:var(--ink-soft);font-size:12px}.catalog-top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.catalog-top h2{margin:0;font:700 32px var(--display)}.catalog-top p{margin:4px 0 0;color:var(--ink-soft);font-size:13px}.sort{border:1px solid var(--line);background:var(--paper);padding:10px 12px;color:var(--ink);font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;display:flex;min-width:0;flex-direction:column;background:rgba(251,250,246,.86);border:1px solid var(--line);animation:rise .5s both;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 14px 28px rgba(23,23,23,.1)}.card-image{display:grid;place-items:center;aspect-ratio:4/3;overflow:hidden;background:var(--paper-deep)}.card-image img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}.card:hover .card-image img{transform:scale(1.06)}.card-body{display:flex;flex:1;flex-direction:column;padding:15px}.card-category{margin:0 0 4px;color:var(--coral);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.card h3{margin:0;font:700 21px/1.1 var(--display)}.card-description{margin:7px 0;color:var(--ink-soft);font-size:13px}.card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px}.price{font-size:12px;font-weight:700}.details{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--gold);border-radius:2px;transition:color .2s ease,background .2s ease,gap .2s ease,box-shadow .2s ease,transform .2s ease}.details::after{content:"->";color:var(--gold);font-size:14px;line-height:1;transition:transform .2s ease,color .2s ease}.details:hover{background:var(--coral);border-color:var(--coral);color:#fff;gap:9px;box-shadow:3px 3px 0 var(--gold);transform:translate(-1px,-1px)}.details:hover::after{color:#fff;transform:translateX(3px)}.empty{grid-column:1/-1;padding:44px 20px;border:1px dashed var(--line);text-align:center;color:var(--ink-soft)}.empty strong{display:block;margin-bottom:5px;color:var(--ink);font:700 26px var(--display)}
  footer{background:var(--ink);color:rgba(244,238,225,.7);padding:30px 0;text-align:center;font-size:13px}footer span{color:var(--gold)}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media(max-width:850px){.nav{flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.menu-toggle{display:block}.brand{flex:1}.search{order:3;flex-basis:100%;max-width:none}.nav-actions{position:absolute;top:100%;left:0;right:0;display:none;flex-direction:column;align-items:flex-start;gap:16px;margin:0;padding:18px 24px;background:rgba(23,23,23,.98);border-top:1px solid rgba(251,250,246,.14);border-bottom:1px solid rgba(251,250,246,.2)}.nav-actions.open{display:flex}.nav-actions .language-select{width:100%;max-width:180px}.hero-grid{grid-template-columns:1fr}.hero-note{justify-self:start}.shop-shell{grid-template-columns:1fr;gap:24px}.filters{position:static;padding:0 0 16px;border-top:0}.category-list{grid-template-columns:repeat(3,1fr)}.filter-caption{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){.wrap{padding:0 16px}.brand{font-size:18px}.nav-actions{gap:8px}.back{font-size:10px}.language-select{padding:7px 5px}.hero{padding:42px 0 30px}.hero h1{font-size:50px}.hero-copy{font-size:15px}.catalog-top{align-items:start;flex-direction:column}.sort{width:100%}.category-list{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card h3{font-size:16px}.card-body{padding:10px 4px}.card-description{font-size:12px}.details{font-size:10px}.card-image{aspect-ratio:1 / 1}}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ticker-track{animation:none}.card{animation:none}.card,.card-image img{transition:none}}
  body{background:#f5f5f5;background-image:none}.ticker{display:none}.hero{padding:30px 0 24px}.hero h1{font-size:clamp(34px,5vw,58px);margin:0}.hero-copy,.hero-note,.filter-caption{display:none}.filters{position:static;padding:0;border:0}.filters h2{font-size:20px;margin-bottom:10px}.category-button{border:0;padding:9px 10px}.category-button:hover,.category-button.active{border:0;background:var(--gold);color:var(--ink)}.catalog-top{margin-bottom:12px}.catalog-top p{display:none}.card{background:#fff;border:0;box-shadow:none}.card:hover{border:0;box-shadow:none;transform:translateY(-3px)}.card-image{background:#fff}.card-body{padding:12px 4px 16px}.card-category,.card-description{display:none}.card h3{font-size:20px}.details{font-size:11px}.sort{border:0;background:#fff}
  :root{--filters-width:min(280px,85vw)}.shop-shell{display:block}.filters{position:fixed!important;top:72px;bottom:0;left:0;width:var(--filters-width);z-index:20;padding:28px 24px;background:#fff;border-right:1px solid var(--line);box-shadow:14px 0 32px rgba(23,23,23,.14);overflow-y:auto;transform:translateX(-105%);transition:transform .3s ease}.filters.is-open{transform:translateX(0)}.menu-toggle{display:none!important}.filters-toggle{position:relative;top:auto;left:auto;z-index:21;display:flex;flex:0 0 44px;flex-direction:column;justify-content:center;align-items:center;gap:3px;width:44px;height:52px;padding:0;background:var(--ink);color:var(--paper);box-shadow:4px 6px 16px rgba(23,23,23,.18);transition:background .2s ease}.filters-toggle.is-open{left:auto;background:var(--gold);color:var(--ink)}.filters-toggle span{width:20px;height:2px;margin:0;background:currentColor}.filters h2{margin-bottom:18px}.category-list.is-hidden{display:grid}.catalog-content{width:100%;transition:width .3s ease,margin-left .3s ease}.shop-shell.panel-open .catalog-content{width:calc(100% - var(--filters-width) - 20px);margin-left:calc(var(--filters-width) + 20px)}
  .nav{display:block;padding-top:12px;padding-bottom:14px}.nav-bar{min-height:48px;display:flex;align-items:center;gap:24px}.nav-bar .brand{flex:1}.search{width:min(520px,100%);max-width:none;margin:12px auto 0}.search button{flex:0 0 auto}.card-image{display:block;cursor:pointer}.card-image img{transition:transform .5s ease}.card:hover .card-image img{transform:scale(1.06)}
  @media(max-width:850px){.nav-bar{gap:12px}.nav-actions{position:static;display:flex;flex-direction:row;align-items:center;gap:10px;margin-left:auto;padding:0;background:transparent;border:0}.nav-actions .language-select{width:auto}.search{margin-top:10px}.filters{top:134px!important}.catalog-content,.shop-shell.panel-open .catalog-content{width:100%!important;margin-left:0!important}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="nav-bar"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navActions"><span></span><span></span><span></span></button><button class="filters-toggle" id="filtersToggle" type="button" aria-label="Open collections" aria-expanded="false" aria-controls="filtersPanel"><span></span><span></span><span></span></button><div class="brand"><span></span>SHUDH LOHA</div><div class="nav-actions" id="navActions"><a class="back" href="index.html">Home</a><select class="language-select" id="languageSelect" aria-label="Choose language"><option value="en">English</option><option value="hi">हिंदी</option><option value="pa">ਪੰਜਾਬੀ</option></select></div></div><form class="search" id="searchForm" role="search"><input id="searchInput" type="search" placeholder="Search cookware..." aria-label="Search cookware" /><button type="submit" aria-label="Search">Search</button></form></div></header>
<main><section class="hero"><div class="wrap"></div></section>
<section class="wrap shop-shell" aria-label="Product catalogue"><aside class="filters" id="filtersPanel"><h2>Collections</h2><div class="category-list" id="categoryList"></div></aside><section class="catalog-content"><div class="catalog-top"><div><h2 id="catalogTitle">All cookware</h2><p id="resultCount">Loading the collection...</p></div><select class="sort" id="sortSelect" aria-label="Sort products"><option value="featured">Featured</option><option value="name">A-Z</option></select></div><div class="grid" id="productGrid"></div></section></section></main>
<footer><div class="wrap">Shudh Loha — <span>Pure Loha, Pure Quality</span> · Malerkotla, Punjab</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
  const fallbackProducts = [
    ['Big Deg','Sarbloh','Assets 2/Big Deg.jpeg'],['Tutma Tava','Sarbloh','Assets 2/tutma tawa.png'],['Tikki Tavi','Sarbloh','Assets 2/Tikki Tavi.jpeg'],['White Batta','Sarbloh','Assets 2/White batta.png'],['Batta','Sarbloh','Assets 2/batta.png'],['Kadhai','Sarbloh','Assets 2/kadhai.png'],['Deg','Sarbloh','Assets 2/deg.png'],['Iron Tawa','Sarbloh','Assets 2/tawi.png'],['Fry Pan','Sarbloh','Assets 2/fry pan.png'],['Iron Fork','Sarbloh','Assets 2/fork.png'],['Iron Spoon','Sarbloh','Assets 2/karchi without handle.png'],['Set of Glasses','Sarbloh','Assets 2/glasses.png'],['Tawa','Sarbloh','Assets 2/tawa.png']
  ].map(([name,category,image]) => ({name,category,image,description:'Pure iron and hand-finished.',price:''}));
  let products = [...fallbackProducts]; let activeCategory = 'All'; let query = '';
  const $ = id => document.getElementById(id);
  const categories = () => ['All', 'Sarbloh', 'Non-Stick', ...new Set(products.map(product => product.category).filter(category => category && category !== 'Sarbloh' && category !== 'Non-Stick'))];
  function renderCategories(){ $('categoryList').innerHTML = categories().map(category => `<button class="category-button${category === activeCategory ? ' active' : ''}" type="button" data-category="${category}">${category}<span>${category === 'All' ? products.length : products.filter(product => product.category === category).length}</span></button>`).join(''); document.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => { activeCategory = button.dataset.category; renderCategories(); renderProducts(); })); }
  function renderProducts(){ const sort = $('sortSelect').value; const previewSuffix = new URLSearchParams(location.search).get('preview') === '1' ? '&preview=1' : ''; const visible = products.filter(product => (activeCategory === 'All' || product.category === activeCategory) && `${product.name} ${product.category}`.toLowerCase().includes(query.toLowerCase())).sort((a,b) => sort === 'name' ? a.name.localeCompare(b.name) : 0); $('catalogTitle').textContent = activeCategory === 'All' ? 'All cookware' : activeCategory; $('resultCount').textContent = `${visible.length} ${visible.length === 1 ? 'piece' : 'pieces'} available`; $('productGrid').innerHTML = visible.length ? visible.map((product,index) => `<article class="card" style="animation-delay:${Math.min(index * 45, 360)}ms"><a class="card-image" href="product.html?item=${encodeURIComponent(product.name)}${previewSuffix}" aria-label="View ${product.name}"><img src="${product.image || 'logo.png'}" alt="${product.name}" loading="lazy"></a><div class="card-body"><h3>${product.name}</h3><div class="card-footer"><span class="price">${product.price || 'Call for price'}</span></div></div></article>`).join('') : '<div class="empty"><strong>Coming soon.</strong></div>'; }
  async function loadProducts(){ if (shudhSupabase) { const {data} = await shudhSupabase.from('products').select('name,image_url,category,description,price').eq('is_active',true).order('sort_order'); if (data?.length) products = data.map(product => ({name:product.name,image:product.image_url,category:product.category === 'Iron Kitchenware' ? 'Sarbloh' : product.category || 'Sarbloh',description:product.description,price:product.price})); } const requestedCategory = new URLSearchParams(location.search).get('category'); if (requestedCategory && categories().includes(requestedCategory)) activeCategory = requestedCategory; renderCategories(); renderProducts(); }
  $('searchForm').addEventListener('submit', event => event.preventDefault()); $('searchInput').addEventListener('input', event => { query = event.target.value.trim(); renderProducts(); }); $('sortSelect').addEventListener('change', renderProducts); $('menuToggle').addEventListener('click', () => { const isOpen = $('navActions').classList.toggle('open'); $('menuToggle').setAttribute('aria-expanded', String(isOpen)); $('menuToggle').setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu'); }); $('filtersToggle').addEventListener('click', () => { const isOpen = $('filtersToggle').getAttribute('aria-expanded') !== 'true'; $('filtersToggle').setAttribute('aria-expanded', String(isOpen)); $('filtersToggle').setAttribute('aria-label', isOpen ? 'Close collections' : 'Open collections'); $('filtersToggle').classList.toggle('is-open', isOpen); $('filtersPanel').classList.toggle('is-open', isOpen); document.querySelector('.shop-shell').classList.toggle('panel-open', isOpen); }); loadProducts(); shudhTrackView();
</script>
</body>
</html>
